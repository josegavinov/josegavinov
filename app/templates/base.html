<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Mi Portafolio {% endblock %}</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: #0f172a;
            color: #f8fafc;
        }

        nav {
            background: #1e293b;
            padding: 1rem;
            display: flex;
            gap: 15px;
        }

        nav a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        footer {
            text-align: center;
            padding: 1rem;
            background: #1e293b;
            position: fixed;
            bottom: 0;
            width: 100%;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <nav>
        <a href="/">Inicio</a>
        <a href="/sobre-mi">Sobre mi</a>
    </nav>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <footer>
        <p>Desarrollado por Jose Gaviño | 2026</p>
    </footer>
</body>

</html>
